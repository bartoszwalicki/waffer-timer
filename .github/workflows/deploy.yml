name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push queues behind an in-flight deploy rather
# than cancelling it, so a half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # sharp is optional and only needed by `npm run icons`, whose output is
      # committed. Skipping it keeps a libvips install failure off the deploy path.
      - run: npm ci --omit=optional

      - run: npm run lint
      # `npm run build` is `tsc -b && vite build`, so this also type-checks.
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Scoped to this job only: the build job runs third-party install scripts
    # and has no business minting an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
